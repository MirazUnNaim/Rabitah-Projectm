spring:
  application:
    name: rabitah-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/rabitah}
    username: ${DATABASE_USERNAME:rabitah}
    password: ${DATABASE_PASSWORD:rabitah}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet.multipart:
    # Posts can contain several photos or videos. Limits here match PostController.
    max-file-size: 100MB
    max-request-size: 500MB
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
server:
  port: ${PORT:8080}
management:
  endpoints.web.exposure.include: health,info
  health.redis.enabled: false
rabitah:
  seed:
    students-per-section-year: ${RABITAH_STUDENTS_PER_SECTION_YEAR:60}
    demo-student-accounts: ${RABITAH_SEED_DEMO_STUDENT_ACCOUNTS:false}
    credentials-export: ${RABITAH_SEED_CREDENTIAL_EXPORT:./generated/demo-student-credentials.csv}
  security:
    jwt-secret: ${RABITAH_JWT_SECRET:}
    access-minutes: 30
    refresh-days: 7
  storage:
    local-root: ${RABITAH_UPLOAD_DIR:./uploads}
    provider: ${RABITAH_STORAGE_PROVIDER:local}
    s3:
      bucket: ${RABITAH_S3_BUCKET:}
      region: ${RABITAH_S3_REGION:auto}
      endpoint: ${RABITAH_S3_ENDPOINT:}
      access-key: ${RABITAH_S3_ACCESS_KEY:}
      secret-key: ${RABITAH_S3_SECRET_KEY:}
